# ─────────────────────────────────────────────────────────────────────────────
# Flash Menu — Nginx vhost
# HTTP → HTTPS redirect + HTTPS reverse proxy
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Allow Let's Encrypt ACME challenge (certbot / acme.sh)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── HTTPS Server ────────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name _;

  # ── TLS ─────────────────────────────────────────────────────────────────────
  # Replace with your real certificate paths (Let's Encrypt / self-signed for dev)
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # ── Security Headers ────────────────────────────────────────────────────────
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options    "nosniff"                                       always;
  add_header X-Frame-Options           "DENY"                                          always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"      always;

  # Request ID propagation for distributed tracing
  add_header X-Request-ID $http_x_request_id always;

  # ── Client limits ───────────────────────────────────────────────────────────
  client_max_body_size 10m;
  limit_conn addr 20;

  # ── Static Assets (Next.js) ─────────────────────────────────────────────────
  location /_next/static/ {
    proxy_pass http://frontend;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ── Backend API ─────────────────────────────────────────────────────────────
  location /api/v1/ {
    # Auth routes — stricter limit
    location ~ ^/api/v1/auth/(login|register|forgot-password|refresh|resend-verification) {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://backend;
      include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Public order creation — moderate limit
    location ~ ^/api/v1/public-menu/.+/order$ {
      limit_req zone=api_order burst=10 nodelay;
      proxy_pass http://backend;
      include /etc/nginx/conf.d/proxy_params.inc;
    }

    # General API
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass http://backend;
    include /etc/nginx/conf.d/proxy_params.inc;
  }

  # ── WebSocket ───────────────────────────────────────────────────────────────
  location /ws {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ── Frontend (catch-all) ─────────────────────────────────────────────────────
  location / {
    proxy_pass http://frontend;
    include /etc/nginx/conf.d/proxy_params.inc;
  }
}
